name: flutter_liquid_gooey
description: A 120Hz liquid glass and gooey fluid physics framework for Flutter powered by GPU Impeller fragment shaders and Euler spring physics.
version: 0.0.2
homepage: https://github.com/tayyabjalbani01/flutter_liquid_gooey
repository: https://github.com/tayyabjalbani01/flutter_liquid_gooey
issue_tracker: https://github.com/tayyabjalbani01/flutter_liquid_gooey/issues

topics:
  - animation
  - ui
  - shader
  - physics
  - widgets

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.20.5
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  shaders:
    - shaders/liquid_gooey.frag
    - shaders/image_melt.frag

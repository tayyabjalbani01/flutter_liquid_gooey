name: Flutter Liquid Gooey CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze_and_test:
    name: Analyze, Test, and Verify Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: dart analyze --fatal-infos

      - name: Run automated tests
        run: flutter test

      - name: Verify pub.dev publishing readiness
        run: dart pub publish --dry-run

name: Bug Report
description: Create a report to help us fix a bug or issue in flutter_liquid_gooey.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: input
    id: flutter_version
    attributes:
      label: Flutter & Dart Version
      description: Run `flutter --version` and paste the output here.
      placeholder: Flutter 3.24.x, Dart 3.5.x
    validations:
      required: true
  - type: checkboxes
    id: platforms
    attributes:
      label: Affected Platforms
      options:
        - label: iOS
        - label: Android
        - label: macOS
        - label: Web
        - label: Windows
        - label: Linux
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue? Code snippets or sample projects are very helpful.
      placeholder: |
        1. Add LiquidGooeyGroup with ...
        2. Tap on ...
        3. See error or visual glitch ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste any terminal logs, stack traces, screenshots, or screen recordings here.

name: Feature Request
description: Suggest an idea, new fluid effect, or improvement for flutter_liquid_gooey.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: We love community ideas! Please describe your proposal clearly below.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? (e.g. "I'm always frustrated when...")
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or new fluid effect you would like to see added.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches
      description: Describe any alternative solutions or workarounds you have considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context / Design References
      description: Add any mockups, links to videos, or visual references demonstrating the effect.
